<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>404, Redirecting...</title>
    <script>
      // Redirect to index.html while preserving the path
      const redirectTo = window.location.pathname + window.location.search + window.location.hash;
      window.location.replace('/' + redirectTo.replace(/^\/+/, ''));
    </script>
  </head>
  <body>
    <p>no page found, Redirecting...</p>
  </body>
</html>
