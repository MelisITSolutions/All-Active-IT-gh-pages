<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script type="text/javascript">
      // Redirect to index.html preserving full path
      var redirect = '/' + location.search.replace(/^.*\?redirect=/, '').replace(/&.*$/, '');
      if (redirect && redirect !== '/') {
        window.history.replaceState(null, '', redirect);
      }
    </script>
  </head>
  <body></body>
</html>
